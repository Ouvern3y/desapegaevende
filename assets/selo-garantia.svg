<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED3A8"/>
      <stop offset="35%" stop-color="#C98283"/>
      <stop offset="70%" stop-color="#A55859"/>
      <stop offset="100%" stop-color="#E8BA87"/>
    </linearGradient>
    
    <linearGradient id="sealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6F0"/>
    </linearGradient>
    
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C98283" flood-opacity="0.25"/>
    </filter>
    
    <!-- Text Paths for circular text -->
    <path id="circleTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
    <path id="circleBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Outer Star/Serrated Rosette (Luxury badge teeth) -->
    <circle cx="100" cy="100" r="88" fill="#FDFBF9" stroke="url(#sealGold)" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="100" cy="100" r="82" fill="url(#sealBg)" stroke="#C98283" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#FAF6F0" stroke-width="1"/>

    <!-- Inner Circle Border -->
    <circle cx="100" cy="100" r="58" fill="#FAF6F0" stroke="url(#sealGold)" stroke-width="2"/>
    <circle cx="100" cy="100" r="54" fill="#FFFFFF" stroke="#E6E1DB" stroke-width="1"/>
  </g>

  <!-- Circular Texts -->
  <!-- Top: GARANTIA INCONDICIONAL -->
  <text font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#231F1C" letter-spacing="2.2">
    <textPath href="#circleTop" startOffset="50%" text-anchor="middle">
      GARANTIA INCONDICIONAL
    </textPath>
  </text>

  <!-- Bottom: 100% RISCO ZERO -->
  <text font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#C98283" letter-spacing="2.5">
    <textPath href="#circleBottom" startOffset="50%" text-anchor="middle">
      ★ 100% REEMBOLSO ★
    </textPath>
  </text>

  <!-- Center Content -->
  <!-- Shield mini-icon on top of the number -->
  <g transform="translate(100, 71) scale(0.85)">
    <path d="M 0,-10 L 8,-6 L 8,2 C 8,7 0,11 0,11 C 0,11 -8,7 -8,2 L -8,-6 Z" fill="#C98283" fill-opacity="0.15" stroke="#C98283" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M -3,-1 L -1,1 L 4,-4" fill="none" stroke="#C98283" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- The big "7" -->
  <text x="100" y="112" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="800" font-style="italic" fill="#231F1C" text-anchor="middle">
    7
  </text>

  <!-- "DIAS" -->
  <text x="100" y="126" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="800" fill="#C98283" letter-spacing="3.5" text-anchor="middle">
    DIAS
  </text>

  <!-- Star accents on left & right -->
  <circle cx="28" cy="100" r="2.5" fill="#C98283"/>
  <circle cx="172" cy="100" r="2.5" fill="#C98283"/>
</svg>