<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 530" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-6%" y="-6%" width="112%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#272422" flood-opacity="0.05" />
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C98283" />
      <stop offset="50%" stop-color="#8E9E88" />
      <stop offset="100%" stop-color="#8C4C52" />
    </linearGradient>
    <linearGradient id="nodeActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Fundo do Card Infográfico -->
  <rect x="2" y="2" width="436" height="526" rx="20" fill="#FAF6F1" stroke="#EAE3D9" stroke-width="1.5" />

  <!-- Linha Conectora da Linha do Tempo (Vertical Dashed) -->
  <line x1="50" y1="52" x2="50" y2="475" stroke="url(#lineGrad)" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" />

  <!-- ================= ETAPA 01: O QUE ESCOLHER ================= -->
  <g transform="translate(0, 24)">
    <circle cx="50" cy="28" r="22" fill="url(#nodeActiveGrad)" stroke="#C98283" stroke-width="2" filter="url(#softShadow)" />
    <!-- Ícone Cabide -->
    <path d="M50 18 C52 18 53.5 19.5 53.5 21 C53.5 22.5 51.5 23.5 50 24.5 L39 31 C38 31.5 38.5 33 40 33 L60 33 C61.5 33 62 31.5 61 31 Z" fill="none" stroke="#8C4C52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Card de Conteúdo -->
    <rect x="86" y="5" width="338" height="48" rx="10" fill="#FFFFFF" stroke="#EFE9E0" stroke-width="1" filter="url(#softShadow)" />
    <text x="100" y="27" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" font-weight="700" fill="#C98283">01</text>
    <text x="126" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#272422">O que escolher</text>
    <text x="126" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7A736C">Peças certas e desapegos estratégicos</text>
    <path d="M404 29 L410 29 M407 26 L410 29 L407 32" stroke="#A89F95" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= ETAPA 02: COMO PREPARAR ================= -->
  <g transform="translate(0, 106)">
    <circle cx="50" cy="28" r="22" fill="url(#nodeActiveGrad)" stroke="#C98283" stroke-width="2" filter="url(#softShadow)" />
    <!-- Ícone Dobra / Cuidados -->
    <path d="M41 23 L59 23 M41 28 L59 28 M41 33 L53 33" stroke="#8C4C52" stroke-width="1.8" stroke-linecap="round" />
    <rect x="40" y="19" width="20" height="18" rx="3" fill="none" stroke="#8C4C52" stroke-width="1.8" />
    <!-- Card de Conteúdo -->
    <rect x="86" y="5" width="338" height="48" rx="10" fill="#FFFFFF" stroke="#EFE9E0" stroke-width="1" filter="url(#softShadow)" />
    <text x="100" y="27" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" font-weight="700" fill="#C98283">02</text>
    <text x="126" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#272422">Como preparar</text>
    <text x="126" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7A736C">Inspeção de detalhes, medidas e estado</text>
    <path d="M404 29 L410 29 M407 26 L410 29 L407 32" stroke="#A89F95" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= ETAPA 03: COMO FOTOGRAFAR ================= -->
  <g transform="translate(0, 188)">
    <circle cx="50" cy="28" r="22" fill="url(#nodeActiveGrad)" stroke="#C98283" stroke-width="2" filter="url(#softShadow)" />
    <!-- Ícone Câmera Celular -->
    <rect x="41" y="20" width="18" height="16" rx="3" fill="none" stroke="#8C4C52" stroke-width="1.8" />
    <circle cx="50" cy="28" r="4" fill="none" stroke="#8C4C52" stroke-width="1.6" />
    <circle cx="56" cy="23" r="1" fill="#8C4C52" />
    <!-- Card de Conteúdo -->
    <rect x="86" y="5" width="338" height="48" rx="10" fill="#FFFFFF" stroke="#EFE9E0" stroke-width="1" filter="url(#softShadow)" />
    <text x="100" y="27" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" font-weight="700" fill="#C98283">03</text>
    <text x="126" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#272422">Como fotografar</text>
    <text x="126" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7A736C">Luz natural e vitrine nítida usando o celular</text>
    <path d="M404 29 L410 29 M407 26 L410 29 L407 32" stroke="#A89F95" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= ETAPA 04: QUANTO COBRAR ================= -->
  <g transform="translate(0, 270)">
    <circle cx="50" cy="28" r="22" fill="url(#nodeActiveGrad)" stroke="#C98283" stroke-width="2" filter="url(#softShadow)" />
    <!-- Ícone Etiqueta Preço -->
    <path d="M41 26 L48 19 L58 19 L58 29 L51 36 Z" fill="none" stroke="#8C4C52" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="54" cy="23" r="1.5" fill="#8C4C52" />
    <!-- Card de Conteúdo -->
    <rect x="86" y="5" width="338" height="48" rx="10" fill="#FFFFFF" stroke="#EFE9E0" stroke-width="1" filter="url(#softShadow)" />
    <text x="100" y="27" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" font-weight="700" fill="#C98283">04</text>
    <text x="126" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#272422">Quanto cobrar</text>
    <text x="126" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7A736C">Pesquisa de mercado e precificação coerente</text>
    <path d="M404 29 L410 29 M407 26 L410 29 L407 32" stroke="#A89F95" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= ETAPA 05: COMO ANUNCIAR ================= -->
  <g transform="translate(0, 352)">
    <circle cx="50" cy="28" r="22" fill="url(#nodeActiveGrad)" stroke="#C98283" stroke-width="2" filter="url(#softShadow)" />
    <!-- Ícone Balão de Anúncio -->
    <path d="M40 22 C40 19.8 42 18 45 18 L55 18 C58 18 60 19.8 60 22 L60 29 C60 31.2 58 33 55 33 L48 33 L43 37 L43 33 C41 33 40 31.5 40 29 Z" fill="none" stroke="#8C4C52" stroke-width="1.8" stroke-linejoin="round" />
    <line x1="45" y1="23" x2="55" y2="23" stroke="#8C4C52" stroke-width="1.4" stroke-linecap="round" />
    <line x1="45" y1="27" x2="52" y2="27" stroke="#8C4C52" stroke-width="1.4" stroke-linecap="round" />
    <!-- Card de Conteúdo -->
    <rect x="86" y="5" width="338" height="48" rx="10" fill="#FFFFFF" stroke="#EFE9E0" stroke-width="1" filter="url(#softShadow)" />
    <text x="100" y="27" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" font-weight="700" fill="#C98283">05</text>
    <text x="126" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#272422">Como anunciar</text>
    <text x="126" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#7A736C">Descrição completa que resolve dúvidas</text>
    <path d="M404 29 L410 29 M407 26 L410 29 L407 32" stroke="#A89F95" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ================= ETAPA 06: COMO CONDUZIR A VENDA ================= -->
  <g transform="translate(0, 434)">
    <circle cx="50" cy="28" r="22" fill="url(#nodeActiveGrad)" stroke="#8E9E88" stroke-width="2.2" filter="url(#softShadow)" />
    <!-- Ícone Sacola / Conclusão -->
    <path d="M42 22 L40 35 C40 36 41 37 42 37 L58 37 C59 37 60 36 60 35 L58 22 Z" fill="none" stroke="#4F5E4B" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M46 22 C46 19 48 17 50 17 C52 17 54 19 54 22" fill="none" stroke="#4F5E4B" stroke-width="1.8" stroke-linecap="round" />
    <!-- Card de Conteúdo (Destaque Sucesso) -->
    <rect x="86" y="5" width="338" height="48" rx="10" fill="#FFFFFF" stroke="#D8E0D6" stroke-width="1.5" filter="url(#softShadow)" />
    <text x="100" y="27" font-family="'Playfair Display', Georgia, serif" font-size="14" font-style="italic" font-weight="700" fill="#4F5E4B">06</text>
    <text x="126" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#272422">Como conduzir a venda</text>
    <text x="126" y="42" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F5E4B">Conversa com interessados e entrega feliz</text>
    <polyline points="404 29 408 33 414 24" fill="none" stroke="#4F5E4B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>